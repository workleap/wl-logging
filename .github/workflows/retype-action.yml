name: Publish documentation website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  publish:
    name: Publish documentation website

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
        - uses: actions/checkout@v7

        - name: Authenticate to the GitHub package firewall
          # The repository .npmrc routes installs through the firewall, but pnpm ignores auth tokens
          # set in a repository .npmrc, so the job token is written to the user-level ~/.npmrc.
          # Precautionary: this job doesn't install dependencies, but the tools it runs may call npm.
          env:
            FIREWALL_TOKEN: ${{ github.token }}
          run: echo "//package-firewall.githubapp.com/npm/enterprises/gsoft/:_authToken=${FIREWALL_TOKEN}" >> ~/.npmrc

        - uses: retypeapp/action-build@latest
          env:
              RETYPE_KEY: ${{ secrets.RETYPE_API_KEY }}

        - uses: retypeapp/action-github-pages@latest
          with:
            update-branch: true