name: CI

# PNPM setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CI: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Required for the Turborepo Git filters.
          fetch-depth: 0

      - name: Check that the lockfile has no tarball URLs
        # pnpm downloads a package from the tarball URL recorded in the lockfile, bypassing the GitHub
        # package firewall configured in .npmrc. The .pnpmfile.cjs file removes the registry.npmjs.org
        # URLs pnpm writes when resolving through the firewall; a URL left in the lockfile was written
        # without the pnpmfile (e.g. with --ignore-pnpmfile or before the pnpmfile was added).
        run: |
          if grep -n "tarball:" pnpm-lock.yaml; then
            echo "::error file=pnpm-lock.yaml::The lockfile contains tarball URLs. Run \"pnpm install --fix-lockfile\" and commit pnpm-lock.yaml. See CONTRIBUTING.md."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
            node-version: "26"
            check-latest: true
            cache: pnpm
            cache-dependency-path: pnpm-lock.yaml

      - name: Authenticate to the GitHub package firewall
        # The repository .npmrc routes installs through the firewall. The job token is written to the
        # user-level ~/.npmrc because pnpm doesn't expand environment variables in a repository .npmrc.
        env:
          FIREWALL_TOKEN: ${{ github.token }}
        run: echo "//package-firewall.githubapp.com/npm/enterprises/gsoft/:_authToken=${FIREWALL_TOKEN}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@v6
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-ci-v11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-v11-
            ${{ runner.os }}-turbo-v11-
          path: .turbo

      - name: Build packages
        # For a PR, only build the packages that are diverging from the pull request original baseline.
        run: |
            if [ "${{ github.event_name }}" == "pull_request" ]; then
                pnpm turbo run build --filter={./packages/*}...[${{ github.event.pull_request.base.sha }}]
            else
                pnpm build-pkg
            fi

      - name: Oxfmt
        run: pnpm oxfmt:check

      - name: Oxlint
        run: pnpm oxlint

      - name: Typecheck
        # For a PR, only typecheck the packages that are diverging from the pull request original baseline.
        run: |
            if [ "${{ github.event_name }}" == "pull_request" ]; then
                pnpm turbo run typecheck --filter=...[${{ github.event.pull_request.base.sha }}]
            else
                pnpm turbo run typecheck
            fi

      - name: Syncpack
        run: pnpm turbo run syncpack

      - name: Test packages
        # For a PR, only test the packages that are diverging from the pull request original baseline.
        run: |
            if [ "${{ github.event_name }}" == "pull_request" ]; then
                pnpm test --filter=...[${{ github.event.pull_request.base.sha }}]
            else
                pnpm test
            fi

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo
