name: Changesets

# Pnpm setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    branches: ["main"]
env:
  CI: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for provenance https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Authenticate to the GitHub package firewall
        # The repository .npmrc routes installs through the firewall. The job token is written to the
        # user-level ~/.npmrc because pnpm doesn't expand environment variables in a repository .npmrc.
        env:
          FIREWALL_TOKEN: ${{ github.token }}
        run: echo "//package-firewall.githubapp.com/npm/enterprises/gsoft/:_authToken=${FIREWALL_TOKEN}" >> ~/.npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@v6
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-changeset-v11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-changeset-v11-
            ${{ runner.os }}-turbo-v11-
          path: .turbo

      - name: Build packages
        run: pnpm build-pkg

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

      - name: Create release Pull Request or publish to NPM
        # v2 is required by @changesets/cli v3, which reports published packages through
        # a CHANGESETS_OUTPUT file instead of the stdout format v1 used to parse.
        # Pinned to a commit hash because this step holds contents: write and the npm
        # trusted publishing token; changesets/action@v2 is a branch, not a tag.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "ci(changesets): version packages"
          pr-title: "Changeset: New Version"
          # Packages are already built by the step above; publish-pkg only runs changeset publish.
          publish-script: pnpm publish-pkg
        env:
          # changeset publish checks npm for already published versions with `pnpm info` from the
          # repository root and ignores publishConfig.registry, so without this the check goes to the
          # package firewall instead of npm.
          # Keep the pnpm_ prefix: pnpm 12 ignores npm_config_registry.
          pnpm_config_registry: https://registry.npmjs.org/
