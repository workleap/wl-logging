packages:
  - packages/*
  - samples/*

# pnpm's own release-age gate, in minutes (7 days). pnpm's default is 1440 (24 hours); the longer delay
# leaves more time for a compromised release to be detected and removed before it can be installed.
minimumReleaseAge: 10080

# Workleap's own packages skip pnpm's gate.
minimumReleaseAgeExclude:
  - "@workleap/*"

allowBuilds:
  agent-browser: true
  core-js: false
  esbuild: true

permissions:
  '@workleap/browserslist-config':
    skills: true
  '@workleap/rsbuild-configs':
    skills: true
  '@workleap/rslib-configs':
    skills: true
  '@workleap/typescript-configs':
    skills: true
  agent-browser:
    skills: true

# Link approved package skills into .claude/skills only, even when another .<agent>/skills dir exists
# (pnpm's default links into every existing one).
skills:
  dirs:
    - .claude/skills
